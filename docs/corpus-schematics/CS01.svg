<title id="CS01-title">One corpus, explicit fact owners</title><desc id="CS01-desc">Follow an owning record to its projections and return through stable anchors. Navigation redundancy does not grant competing edit authority. Accepted code owns implemented facts at its admitted revision; requirements remain normative. Source kind and candidate evidence do not establish accepted behavior. Links are navigation unless the edge table says derivation.</desc>
