<title id="CS03-title">Publication, failure and recovery</title><desc id="CS03-desc">Read the real documentation publication sequence, including the gap between core completion and graph completion. A core PASS can precede a graph failure. Full-corpus synchronization requires agreeing complete core records AND a current verified graph; cross-filesystem writes are not one atomic transaction.</desc>
