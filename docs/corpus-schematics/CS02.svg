<title id="CS02-title">Module completion to corpus refresh</title><desc id="CS02-desc">Separate the future engine completion chain from the documentation update tools that exist today. No automatic admission collector exists. Current loaders explicitly retain unassessed modules; accepted-state projection needs reviewed tooling evolution before it can be used. Released migration bytes require a qualified freeze guard and navigation sidecars.</desc>
