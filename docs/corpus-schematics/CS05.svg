<title id="CS05-title">Context, change impact and return paths</title><desc id="CS05-desc">Keep the full corpus reachable while scouts and coding threads read only the evidence needed for their current module and boundary. Text coverage and relationship coverage are different. A graph lead or snapshot hash does not prove a read or current validity. Dependency edges, semantic flows and navigation links remain separate.</desc>
