# Route policy declaration and declared recipes, read by one parser,
# `habitat_engine::route::Routing::parse` (`Policy::load` is that parse plus the
# baseline check), and by nothing else. Every value here is a declared input, not
# a measurement.
schema_version = 1

# Hard filters, applied to every screened recipe in this order. A recipe stops
# at its first non-pass: an exclusion names the rule and the compared values;
# an evidence gap (unobserved, unknown or stale availability; a figure a filter
# needs but the recipe does not carry) routes the whole decision to the
# baseline. Filters are never traded against ranking. Each of the seven must
# appear exactly once; the loader refuses an unknown, duplicate or missing name.
filters = [
  "required_capabilities",
  "context_limit",
  "privacy_class",
  "availability",
  "cost_ceiling",
  "deadline",
  "quality_floor",
]

# Ranking keys over the eligible set, compared in this order: lower cost first,
# then higher quality, then lower latency. Every eligible recipe must carry all
# three figures; a missing figure is an evidence gap. Each key appears once.
ranking = ["cost", "quality", "latency"]

# The tie rule. Two or more eligible recipes equal on every ranking key are a
# tie, and a tie routes to the baseline naming the tied recipes. "baseline" is
# the only admitted value; the loader refuses any other by name.
tie = "baseline"

# An availability observation whose age in milliseconds reaches this bound is
# stale evidence (age >= bound), within the roster's 60000 ms TTL ceiling.
staleness_bound_ms = 30000

# Declared recipes (route's recipe tuple: id, version 1..65535, adapter UUIDv4,
# actual_model_required, roster_record UUIDv4, serves = task classes, and the
# optional figures context_limit_tokens, cost_microunits (external currency),
# quality_basis_points and latency_ms; an absent figure is unknown). A recipe
# restates no roster fact: capabilities, locality and availability come from the
# roster record it names. None is declared here: recipes are populated at
# commissioning from the runtimes actually available (RC02/T18), and until then
# the baseline below names no declared recipe, so task.preview answers that the
# route configuration is refused. At most 128 rows.
recipes = []

# The explicit baseline recipe: the fixed local recipe a tie, an evidence gap or
# an empty eligible set routes to. The loader binds this identity to the baseline
# recipe value the caller supplies and refuses a baseline that is not local or
# lacks a cost, quality or latency figure. No admitted roster record stands
# behind this identity yet; it is a declared value (see docs/checks.md).
[baseline]
recipe = "09000000-0000-4000-8000-00000000000b"
